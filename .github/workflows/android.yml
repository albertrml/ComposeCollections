name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List gradle wrapper contents
        run: ls -la gradle/wrapper

      - name: Build and Test Library
        run: ./gradlew :collections:test :collections:assembleDebug

      - name: Build Gallery App
        run: ./gradlew :app:assembleDebug

      - name: Upload Gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk